name: Compatibility Check

on:
  push:
    branches: [main, activ_dev]
  pull_request:
    branches: [main, activ_dev]

jobs:
  check-install:
    name: Python ${{ matrix.python-version }} install check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ForMoSA (with dev extras)
        run: pip install -e ".[dev]"

      - name: Check public API import and version
        run: |
          python -c "
          from ForMoSA import Analysis
          import ForMoSA
          print(f'ForMoSA {ForMoSA.__version__} imported successfully on Python ${{ matrix.python-version }}')
          "

      - name: Install runtime extras
        run: pip install dask netCDF4 bottleneck

      - name: Run tests
        run: pytest -q
