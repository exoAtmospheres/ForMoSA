name: Draft PDF
on:
  push:
    paths:
      - paper/**
      - .github/workflows/draft-pdf.yml

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # openjournals/openjournals-draft-action expects bibliography files to be
      # discoverable relative to the paper path via its "resource path".
      # In this repo, paper.md already points to paper/paper.bib, but the action
      # looks for paper.bib at the root of the resource path, so we expose a
      # copy there for compatibility.
      - name: Make paper.bib available at repository root (compat)
        run: cp paper/paper.bib paper.bib

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          # This should be the path to the paper within your repo.
          paper-path: paper/paper.md

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          # This is the output path where Pandoc will write the compiled
          # PDF. Note, this should be the same directory as the input
          # paper.md
          path: paper/paper.pdf
