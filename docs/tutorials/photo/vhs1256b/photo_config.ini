
[config_path]
    # Path to the observed spectrum file
    observation_path = /Users/rajpoot/Karmabhumi/Packages/ForMoSA/docs/tutorials/photo/vhs1256b/data/VHS1256b_photometry.fits,
    # Path to store your interpolated grid
    adapt_store_path = /Users/rajpoot/Karmabhumi/Packages/ForMoSA/docs/tutorials/photo/vhs1256b/adapted_grid
    # Path to store your results
    result_path = /Users/rajpoot/Karmabhumi/Packages/ForMoSA/docs/tutorials/photo/vhs1256b/results
    # Path to the model
    model_path = /Users/rajpoot/Karmabhumi/Packages/ForMoSA/docs/tutorials/photo/vhs1256b/grid/ExoREM_native.nc

[config_adapt]
    # Adaptation method. /!\ For safety reasons, this will also be the interpolation method
    # Format : 'linear' or 'nearest' or 'zero' or 'slinear' or 'quadratic' or 'cubic' or 'quintic' or 'pchip' or 'barycentric' or 'krogh' or 'akima' or 'makima'
    # MOSAIC : No
    method = linear
    # If you want to use an emulator to fit your grid (smooth out the grid).
    # Format : 'NA' or 'PCA, ncomp' or 'NMF, ncomp'
    # MOSAIC : No
    emulator = NA,
    # Target resolution to reach for the observation(s).
    # Format : float or 'obs' (if you want to keep the original obs resolution)
    # MOSAIC : Yes
    target_res_obs = obs,
    # Target resolution to reach for the model.
    # Format : float or 'obs' or 'mod' (if you want to keep the model's resolution during inversion)
    # MOSAIC : Yes
    target_res_mod = obs,
    # Wavelength range used to estimate the continuum.
    # Format : 'NA' or 'window1_min / window1_max, window2_min / ... / windowN_max'
    # MOSAIC : Yes
    wav_cont = NA,
    # Resolution used to estimate the continuum.
    # Format : 'NA' or float
    # MOSAIC : Yes
    res_cont = NA,
    # Joblib parallel backend used during grid adaptation.
    # Built-in options : 'loky' (default, true multiprocessing), 'multiprocessing', 'threading', 'sequential' (no parallelism)
    # Third-party options (require extra install) : 'dask', 'ray'
    # MOSAIC : No
    backend = loky
    # Number of parallel jobs used during grid adaptation.
    # Format : -1 (use all available CPUs) or a positive integer (e.g. 4)
    # MOSAIC : No
    n_jobs = 12

[config_inversion]
    # Method to calculate the loglikelihood function used in the nested sampling procedure.
    # Format : 'chi2' or 'chi2_covariance' or 'chi2_noisescaling' or 'chi2_noisescaling_covariance' or 'CCF_Brogi' or 'CCF_Zucker' or 'CCF_custom'
    # MOSAIC : Yes
    logL_type = chi2,
    # Wavelength range(s) used during the nested sampling procedure.
    # Format : 'window1_min / window1_max, window2_min / ... / windowN_max'
    # MOSAIC : Yes
    wav_fit = "2.0, 16.0",
    # Nested sampling algorithm used.
    # Format : 'nestle' or 'pymultinest' or 'ultranest'
    # MOSAIC : No
    ns_algo = nestle
    # Number of living points during the nested sampling procedure.
    # Format : int
    # MOSAIC : No
    npoints = 100
    # Least-square bounds.
    # Format : 'NA' or 'lower, upper'
    # MOSAIC : Yes
    hc_lower_bounds_lsq = NA,
    # Least-square bounds.
    # Format : 'NA' or 'lower, upper'
    # MOSAIC : Yes
    hc_higher_bounds_lsq = NA,

[config_parameters]
    # Definition of the prior function of each parameter explored by the grid. Please refer to the documentation to check
    # the parameter space explore by each grid. Check prior functions for more infos
    # Format : 'function', function_param1, function_param2
    # MOSAIC : No
    par1 = uniform, 400, 2000
    par2 = uniform, 3.0, 5.0
    par3 = uniform, -0.5, 1.0
    par4 = uniform, 0.1, 0.8
    # Definition of the prior function of each extra-grid parameter. Check prior functions for more infos
    # Format : 'function', function_param1, function_param2
    # MOSAIC : Yes and No, check the doc !
    r = NA,
    d = NA,
    alpha = NA,
    bb_T = NA,
    rv = NA,
    vsini = NA,
    ld = NA,

[config_nestle]
    # Nestle configuration parameters. For more details, please see: http://kylebarbary.com/nestle/index.html
    # Format : _
    # MOSAIC : No
    method = single
    update_interval = None
    npdim = None
    maxiter = None
    maxcall = None
    dlogz = None
    decline_factor = None
    rstate = None

[config_pymultinest]
    importance_nested_sampling = True
    multimodal = True
    const_efficiency_mode = False
    evidence_tolerance = 0.5
    sampling_efficiency = 0.8
    n_iter_before_update = 100
    null_log_evidence = -1e+90
    max_modes = 100
    mode_tolerance = -1e+90
    seed = -1
    verbose = True
    resume = False
    context = 0
    log_zero = -1e+100
    max_iter = 0
    init_MPI = False
    wrapped_params = None
    dump_callback = None
    use_MPI = True

[config_ultranest]
    wrapped_params = None
    vectorized = False
    # Ultranest configuration parameters. For more details, please see: https://johannesbuchner.github.io/UltraNest/readme.html
    # Format : _
    # MOSAIC : No
    resume = True
    run_num = None
    num_bootstraps = 30
    storage_backend = hdf5
    warmstart_max_tau = -1
    dlogz = 0.5
    max_iters = None
    max_ncalls = None
    min_ess = 400
    frac_remain = 0.01
    cluster_num_live_points = 40
    Lepsilon = 0.001
